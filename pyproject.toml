[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "QSenti"
version = "1.0.0"
requires-python = ">= 3.8"
dependencies = [
    "numpy",
]
authors = [
  {name = "Anjelo Laroza", email = "larozaanjelo@gmail.com"},
]
maintainers = [
  {name = "Anjelo Laroza", email = "larozaanjelo@gmail.com"}
]
description = "A lightweight sentiment classifier for LLM sessions powered by VADER & Quantum-inspired Math."
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Commercial/Personal",
    "Topic :: Scientific/Research :: Affective Computing",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Communications :: Chat",
]

[tool.hatch.build.targets.wheel]
packages = ["QSenti"]